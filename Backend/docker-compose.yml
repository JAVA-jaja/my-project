services:
  frontend:
    build:
      context: ../Frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
    environment:
      PORT: 8080
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://shorturl:change-me@postgres:5432/shorturl?sslmode=disable}
      # Local frontend ports can vary (for example when exposed by a VM/cluster).
      # Set an exact origin in production; local Compose allows all origins by default.
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:-*}"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
    command: ["/app/migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://shorturl:change-me@postgres:5432/shorturl?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      #Host name = postgres
      POSTGRES_DB: shorturl  #maintenance database
      POSTGRES_USER: shorturl #User
      POSTGRES_PASSWORD: change-me #password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shorturl -d shorturl"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:9.17
    environment:
      #e-mail = admin@example.com
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com} 
      #password = change-me
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change-me}
    ports:
        #localhost:5050
      - "127.0.0.1:5050:80" 
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
